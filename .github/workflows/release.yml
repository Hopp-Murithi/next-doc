name: Release

# Publishing only ever happens here, from a tag, so the provenance attestation
# actually means something. Never publish from a laptop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned LTS, never a floating latest, so a release is reproducible.
          node-version: 20.18.1
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || { echo "Tag $TAG does not match package version $PKG"; exit 1; }

      - name: Full verification
        run: pnpm run verify

      - name: Inspect the tarball contents
        run: npm pack --dry-run

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
