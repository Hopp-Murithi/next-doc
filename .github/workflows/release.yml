name: Release

# Publishing only ever happens here, from a tag, so the provenance attestation
# actually means something. Never publish from a laptop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned LTS, never a floating latest, so a release is reproducible.
          node-version: 20.18.1
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || { echo "Tag $TAG does not match package version $PKG"; exit 1; }

      - name: Full verification
        run: pnpm run verify

      - name: Inspect the tarball contents
        run: npm pack --dry-run

      # Re-tagging or re-running should not fail on a version that is already
      # out. Publishing is the one step here that cannot be undone.
      - name: Is this version already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on the registry, skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # NPM_TOKEN must be a token that does not require a one time password,
      # otherwise this step fails with EOTP after building and signing
      # everything. Either works:
      #   Automation token, npmjs.com > Access Tokens > Classic > Automation
      #   Granular token with "Bypass 2FA" enabled, scoped to @wamasoda
      # A Publish or Read-only classic token still prompts for 2FA and fails.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
