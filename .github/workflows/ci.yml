name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Path handling is the classic source of CLI bugs, so Windows is not optional.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Bundle budget
        run: pnpm run size

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  smoke:
    name: Real world smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Synthetic fixtures cannot catch everything. Run against real trees too.
      - name: Clone example apps
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/vercel/next.js.git /tmp/next
          cd /tmp/next && git sparse-checkout set examples/with-stripe-typescript examples/blog-starter

      - name: Scan example apps
        run: |
          node dist/cli.js --cwd /tmp/next/examples/with-stripe-typescript --json > /tmp/stripe.json || true
          node dist/cli.js --cwd /tmp/next/examples/blog-starter --json > /tmp/blog.json || true
          node -e "for (const f of ['/tmp/stripe.json','/tmp/blog.json']) { const r = JSON.parse(require('fs').readFileSync(f,'utf8')); if (r.schemaVersion !== 1) throw new Error('bad report: ' + f); console.log(f, r.summary); }"
