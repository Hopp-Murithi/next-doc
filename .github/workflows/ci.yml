name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday morning, to catch a dependency or runner change rather than a
    # code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and pull request gets this one job, and it is the whole suite.
  # Fast feedback, one runner.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run size

  # The full grid only where it earns its cost: before a merge, on main, on the
  # weekly run, or on demand. Path handling is the classic source of CLI bugs,
  # so Windows is never dropped, only run less often.
  matrix:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          # Already covered by the verify job above.
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  audit:
    name: Dependency audit
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  # Synthetic fixtures cannot catch everything, but cloning real apps is slow.
  # Weekly, or when you ask for it.
  smoke:
    name: Real world smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Clone example apps
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/vercel/next.js.git /tmp/next
          cd /tmp/next && git sparse-checkout set examples/with-stripe-typescript examples/blog-starter

      - name: Scan example apps
        run: |
          node dist/cli.js --cwd /tmp/next/examples/with-stripe-typescript --json > /tmp/stripe.json || true
          node dist/cli.js --cwd /tmp/next/examples/blog-starter --json > /tmp/blog.json || true
          node -e "for (const f of ['/tmp/stripe.json','/tmp/blog.json']) { const r = JSON.parse(require('fs').readFileSync(f,'utf8')); if (r.schemaVersion !== 1) throw new Error('bad report: ' + f); console.log(f, r.summary); }"
